# Local test environment. Uses the hosted Supabase project (publishable key is built in),
# so there's nothing else to run. Ports bind on all interfaces: open http://<this-computer's-LAN-IP>:5173
# on a phone on the same Wi-Fi.
services:
  web:
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules        # keep the container's own node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # reliable hot reload on mounted folders (macOS)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 6

  preview:
    profiles: ["preview"]
    build:
      context: ./web
      target: preview
    ports:
      - "4173:4173"
