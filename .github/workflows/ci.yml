name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  standards:
    name: Repository standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out Mad Mallard standards toolkit (pinned)
        uses: actions/checkout@v7
        with:
          repository: drakeg/madmallard-repository-standards
          ref: 5c43391e7a6860cf9691b45758ee9003f9f0222f
          path: .standards
      - name: Required documents present
        run: python3 .standards/scripts/audit.py --repo . --check
      - name: README badges match the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .standards/scripts/badges.py --repo . --mode check

  docker:
    name: Docker Compose serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start dev server and production preview
        run: docker compose --profile preview up -d --build web preview
      - name: Both answer with the app
        run: |
          for port in 5173 4173; do
            ok=
            for i in $(seq 1 45); do
              if curl -fsS "http://localhost:$port/" | grep -q '<div id="root">'; then ok=1; break; fi
              sleep 2
            done
            [ -n "$ok" ] && echo "✓ app served on :$port" || { echo "::error::nothing on :$port"; docker compose --profile preview logs; exit 1; }
          done
      - if: always()
        run: docker compose --profile preview down
